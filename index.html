<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111114">
<title>Team Ferreira — Treino</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-badge">TF</span>
    <div>
      <h1>TEAM FERREIRA</h1>
      <small>Consultoria Esportiva</small>
    </div>

  <div id="timer-chip" class="timer-chip hidden">
    <span class="dot"></span><span id="timer-text">00:00</span>

</header>

<main id="view"></main>

<nav class="tabbar">
  <button data-tab="treino" class="tab active"><span class="ico">🏋️</span>Treino</button>
  <button data-tab="calendario" class="tab"><span class="ico">📅</span>Calendário</button>
  <button data-tab="dieta" class="tab"><span class="ico">🍗</span>Dieta</button>
  <button data-tab="compras" class="tab"><span class="ico">🛒</span>Compras</button>
</nav>

<div id="modal-root"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
